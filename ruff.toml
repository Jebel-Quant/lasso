line-length = 120
target-version = "py311"

[lint]
select = [
    "A", "ANN001", "ANN2", "ARG", "B", "BLE", "C4", "D", "D105", "D107", "E", "F", "I",
    "ICN", "N", "PIE", "PT", "RUF", "S", "SIM", "TRY", "UP", "W",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[lint.pydocstyle]
convention = "google"
