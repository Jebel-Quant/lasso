line-length = 120
target-version = "py311"

[lint]
select = [
    "A", "ANN001", "ANN2", "ARG", "B", "BLE", "C4", "D", "D105", "D107", "E", "F", "I",
    "ICN", "N", "PIE", "PT", "RUF", "S", "SIM", "TRY", "UP", "W",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[lint.pydocstyle]
convention = "google"

# marimo notebooks
[lint.per-file-ignores]
"**/notebooks/*.py" = [
    "ANN",     # interactive cells, not annotated functions
    "D100",    # marimo requires `import marimo` as the first statement
    "N803",
    "S101",
    "B018",
    "RUF001",
    "RUF002",
]
