# Build every preprint under preprints/ on each pull request into main, and when one is
# merged, publish the PDFs on the `paper` branch with an index.html that links them, and
# each preprint's arXiv source tarball on the `arxiv` branch. GitHub Pages serves `paper`.
#
# Each folder in preprints/ holds one preprint. Its main source is the one .tex file there
# with a \documentclass, and the PDF takes that file's name. A python/make_figures.py in its folder,
# if present, draws the figures into figures/ before the build.
#
# The first page carries an arXiv-style stamp in its left margin: build date, repository
# and short commit hash. It is injected at build time, so the source itself stays clean.
name: compile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The merge commit on main once merged, the PR head before that.
  SHA: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}

jobs:
  # Every job pins ubuntu-24.04 rather than ubuntu-latest: the TeX Live the compile job
  # installs comes from the runner's apt, so moving the image changes the toolchain.
  # Move all three together, and on purpose.
  #
  # One matrix entry per preprint: its folder and the stem of its main .tex file.
  discover:
    # A PR closed without merging has nothing to build.
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    outputs:
      preprints: ${{ steps.find.outputs.preprints }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ env.SHA }}

      - name: Find the preprints
        id: find
        run: |
          shopt -s nullglob
          entries=()
          for dir in preprints/*/; do
            dir=${dir%/}
            mains=($(grep -l '^[[:space:]]*\\documentclass' -- "$dir"/*.tex))
            if [ "${#mains[@]}" -ne 1 ]; then
              echo "::error::expected one .tex file with a \\documentclass in $dir, found ${#mains[@]}: ${mains[*]}"
              exit 1
            fi
            main=${mains[0]##*/}
            entries+=("$(jq -nc --arg dir "$dir" --arg job "${main%.tex}" '{dir: $dir, job: $job}')")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::no preprints under preprints/"
            exit 1
          fi
          preprints=$(printf '%s\n' "${entries[@]}" | jq -sc .)
          # The PDFs share one branch, so two preprints cannot share a name.
          dupes=$(jq -r 'group_by(.job) | map(select(length > 1) | .[0].job) | join(", ")' <<< "$preprints")
          if [ -n "$dupes" ]; then
            echo "::error::more than one preprint builds $dupes.pdf"
            exit 1
          fi
          echo "preprints=$preprints" >> "$GITHUB_OUTPUT"

  compile:
    needs: discover
    name: compile (${{ matrix.job }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.preprints) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ env.SHA }}

      - name: Install TeX Live
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          version: 1

      # The file database, font maps and pdflatex format are generated at install time,
      # not packaged, so a restore from the cache leaves them out. Rebuild them.
      - name: Rebuild TeX's generated files
        run: sudo mktexlsr && sudo updmap-sys && sudo fmtutil-sys --byfmt pdflatex

      # make_figures.py can spend minutes computing a note's numbers before it draws, so
      # reuse the figures until the preprint's Python or its data change.
      - name: Restore the figures
        id: figures
        if: hashFiles(format('{0}/python/make_figures.py', matrix.dir)) != ''
        uses: actions/cache@v6.1.0
        with:
          path: ${{ matrix.dir }}/figures
          key: figures-${{ matrix.job }}-${{ hashFiles(format('{0}/**/*.py', matrix.dir), format('{0}/**/*.py.lock', matrix.dir), format('{0}/data/**', matrix.dir)) }}

      # The dependencies are pinned inline in python/make_figures.py (PEP 723) and locked
      # in python/make_figures.py.lock next to it, so key uv's cache on both.
      - uses: astral-sh/setup-uv@v7.6.0
        if: steps.figures.outcome == 'success' && steps.figures.outputs.cache-hit != 'true'
        with:
          cache-dependency-glob: |
            ${{ matrix.dir }}/python/make_figures.py
            ${{ matrix.dir }}/python/make_figures.py.lock

      - name: Draw the figures
        if: steps.figures.outcome == 'success' && steps.figures.outputs.cache-hit != 'true'
        run: uv run python/make_figures.py

      - name: Compile with the stamp
        env:
          JOB: ${{ matrix.job }}
          STAMP: ${{ github.repository }}
        run: |
          date=$(LC_ALL=C date -u '+%-d %b %Y')
          sha=${SHA::7}
          cat > stamp.tex <<EOF
          \AddToHookNext{shipout/foreground}{%
            \put(0.6in,-0.5\paperheight){\rotatebox{90}{\makebox[0pt][c]{%
              \fontsize{16}{16}\selectfont\sffamily\color{black!45}%
              ${date}\qquad\detokenize{${STAMP}}\qquad\texttt{${sha}}}}}}
          EOF
          for _ in 1 2 3; do
            pdflatex -interaction=nonstopmode -halt-on-error -jobname="$JOB" "\\input{stamp}\\input{$JOB}"
          done

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-${{ matrix.job }}
          path: ${{ matrix.dir }}/${{ matrix.job }}.pdf
          if-no-files-found: error

      # arXiv compiles the source itself, so it gets the .tex and the figures it includes.
      # The check compiles that tarball alone in an empty directory, as arXiv will.
      - name: Package and check the arXiv source
        run: make arxiv-check

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: arxiv-${{ matrix.job }}
          path: ${{ matrix.dir }}/${{ matrix.job }}.tar.gz
          if-no-files-found: error

  # One push with every PDF, so the matrix jobs never race for the branch.
  #
  # Two merges in quick succession race: both builds force-push, and the older one can
  # finish last and overwrite the newer PDFs. So publishing runs one merge at a time, and
  # a build that is no longer of main's tip publishes nothing; the newer merge's build
  # publishes instead.
  publish:
    needs: compile
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Check this build is of main's tip
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${tip::7}; its own build will publish, not this one (${SHA::7})"
          fi

      - uses: actions/download-artifact@v8.0.2
        if: steps.tip.outputs.current == 'true'
        with:
          pattern: pdf-*
          merge-multiple: true
          path: pdfs

      - uses: actions/download-artifact@v8.0.2
        if: steps.tip.outputs.current == 'true'
        with:
          pattern: arxiv-*
          merge-multiple: true
          path: arxiv/arxiv

      # Only for the titles, which the index takes from each preprint's \title.
      - uses: actions/checkout@v6.1.0
        if: steps.tip.outputs.current == 'true'
        with:
          ref: ${{ env.SHA }}
          path: src
          sparse-checkout: preprints

      # One link per PDF, labelled with the main title: the \title text up to its first
      # \\ or closing brace, so a subtitle set on a second line is left out.
      - name: Write the index page
        if: steps.tip.outputs.current == 'true'
        working-directory: pdfs
        run: |
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Preprints</title>
          <style>
            body { font: 17px/1.6 Georgia, serif; max-width: 38rem; margin: 4rem auto; padding: 0 1rem; color: #222; }
            a { color: #1a4f8b; }
            footer { margin-top: 3rem; font-size: 14px; color: #777; }
            footer a { color: inherit; }
          </style>
          <h1>Preprints</h1>
          <ul>
          HTML
            for pdf in *.pdf; do
              job=${pdf%.pdf}
              title=$(sed -n 's/^\\title{\([^\\}]*\).*/\1/p' ../src/preprints/*/"$job".tex | head -n 1)
              title=${title//--/–}
              title=${title//&/&amp;}; title=${title//</&lt;}; title=${title//>/&gt;}
              echo "  <li><a href=\"$pdf\">${title:-$job}</a></li>"
            done
            cat <<HTML
          </ul>
          <footer>Built from <a href="https://github.com/$GITHUB_REPOSITORY/commit/$SHA">${SHA::7}</a> of <a href="https://github.com/$GITHUB_REPOSITORY">$GITHUB_REPOSITORY</a> on $(LC_ALL=C date -u '+%-d %b %Y').</footer>
          </html>
          HTML
          } > index.html
          touch .nojekyll

      - name: Publish to the paper branch
        if: steps.tip.outputs.current == 'true'
        working-directory: pdfs
        run: |
          git init -q -b paper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.pdf index.html .nojekyll
          git commit -q -m "preprints from ${SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" paper

      # The arXiv sources go to their own branch, which holds nothing else, as
      # arxiv/<preprint>.tar.gz: ready to upload as they are.
      - name: Publish to the arxiv branch
        if: steps.tip.outputs.current == 'true'
        working-directory: arxiv
        run: |
          git init -q -b arxiv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arxiv/*.tar.gz
          git commit -q -m "arXiv sources from ${SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" arxiv
