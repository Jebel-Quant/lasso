# Build every preprint under preprints/ on each pull request into main, and when one is
# merged, publish the PDFs on the `paper` branch with an index.html that links them (styled
# with Tailwind, compiled at build time), and each preprint's arXiv source, as a tarball and
# a zip, on the `arxiv` branch. GitHub Pages serves `paper`.
#
# Each folder in preprints/ holds one preprint. Its main source is the one .tex file there
# with a \documentclass, and the PDF takes that file's name. A python/make_figures.py in its folder,
# if present, draws the figures into figures/ before the build.
#
# The first page carries an arXiv-style stamp in its left margin: build date, repository
# and short commit hash. It is injected at build time, so the source itself stays clean.
name: compile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The merge commit on main once merged, the PR head before that.
  SHA: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}

jobs:
  # Every job pins ubuntu-24.04 rather than ubuntu-latest: the TeX Live the compile job
  # installs comes from the runner's apt, so moving the image changes the toolchain.
  # Move all three together, and on purpose.
  #
  # One matrix entry per preprint: its folder and the stem of its main .tex file.
  discover:
    # A PR closed without merging has nothing to build.
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    outputs:
      preprints: ${{ steps.find.outputs.preprints }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ env.SHA }}

      - name: Find the preprints
        id: find
        run: |
          shopt -s nullglob
          entries=()
          for dir in preprints/*/; do
            dir=${dir%/}
            mains=($(grep -l '^[[:space:]]*\\documentclass' -- "$dir"/*.tex))
            if [ "${#mains[@]}" -ne 1 ]; then
              echo "::error::expected one .tex file with a \\documentclass in $dir, found ${#mains[@]}: ${mains[*]}"
              exit 1
            fi
            main=${mains[0]##*/}
            entries+=("$(jq -nc --arg dir "$dir" --arg job "${main%.tex}" '{dir: $dir, job: $job}')")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::no preprints under preprints/"
            exit 1
          fi
          preprints=$(printf '%s\n' "${entries[@]}" | jq -sc .)
          # The PDFs share one branch, so two preprints cannot share a name.
          dupes=$(jq -r 'group_by(.job) | map(select(length > 1) | .[0].job) | join(", ")' <<< "$preprints")
          if [ -n "$dupes" ]; then
            echo "::error::more than one preprint builds $dupes.pdf"
            exit 1
          fi
          echo "preprints=$preprints" >> "$GITHUB_OUTPUT"

  compile:
    needs: discover
    name: compile (${{ matrix.job }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.preprints) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ env.SHA }}

      # The image's package index ages with the image. Once Ubuntu replaces a dependency
      # (ghostscript 7.9 by 7.10 in October 2026), the index names a file no mirror has,
      # the install below fails without failing the step, and it caches nothing. A PR
      # cannot read another PR's cache, so each new PR installs afresh and needs this.
      - name: Refresh the package index
        run: sudo apt-get update -q

      - name: Install TeX Live
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          version: 1

      # The file database, font maps and pdflatex format are generated at install time,
      # not packaged, so a restore from the cache leaves them out. Rebuild them.
      - name: Rebuild TeX's generated files
        run: sudo mktexlsr && sudo updmap-sys && sudo fmtutil-sys --byfmt pdflatex

      # A restore from the cache brings pdflatex back but can leave bibtex out: a PR's first
      # run, which installs afresh, has it, and its later runs, which restore, do not. A
      # preprint with a BibTeX bibliography (refs/*.bib) needs it, so reinstall it then.
      - name: Make sure BibTeX is there
        if: hashFiles(format('{0}/refs/*.bib', matrix.dir)) != ''
        run: command -v bibtex || sudo apt-get install -y -q --reinstall texlive-binaries

      # The dependencies are pinned inline in each python/*.py script (PEP 723) and locked
      # in the .py.lock next to it, so key uv's cache on both.
      - uses: astral-sh/setup-uv@v7.6.0
        if: hashFiles(format('{0}/python/*.py', matrix.dir)) != ''
        with:
          cache-dependency-glob: |
            ${{ matrix.dir }}/python/*.py
            ${{ matrix.dir }}/python/*.py.lock

      # A julia/*.jl marked `# run: after figures` runs in the environment that
      # julia/Project.toml and julia/Manifest.toml pin; the Manifest fixes the Julia version.
      - uses: julia-actions/setup-julia@v3.0.2
        if: hashFiles(format('{0}/julia/Project.toml', matrix.dir)) != ''
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3.4.0
        if: hashFiles(format('{0}/julia/Project.toml', matrix.dir)) != ''

      # An R/*.R marked `# run: after figures` runs with Rscript after the Julia checks.
      # It names the CRAN packages it needs on a line `# needs:` and the Ubuntu libraries
      # they link on a line `# apt:`. R and the packages are pinned as in r-check.yml: R
      # itself, and the packages through a dated snapshot of CRAN's Ubuntu binaries.
      - name: Find the R checks
        id: r
        run: |
          shopt -s nullglob
          files=(R/*.R)
          [ "${#files[@]}" -gt 0 ] || exit 0
          checks=$(grep -l '^# run: after figures$' "${files[@]}" || true)
          [ -n "$checks" ] || exit 0
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "packages=$(sed -n 's/^# needs: *//p' $checks | tr -s ' ,' '\n' | sort -u | xargs)" >> "$GITHUB_OUTPUT"
          echo "apt=$(sed -n 's/^# apt: *//p' $checks | tr -s ' ,' '\n' | sort -u | xargs)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2.14.0
        if: steps.r.outputs.found == 'true'
        with:
          r-version: 4.6.1
          use-public-rspm: false
      - name: Install the R checks' packages
        if: steps.r.outputs.found == 'true'
        env:
          CRAN_SNAPSHOT: https://packagemanager.posit.co/cran/__linux__/noble/2026-09-01
          PACKAGES: ${{ steps.r.outputs.packages }}
          APT: ${{ steps.r.outputs.apt }}
        run: |
          if [ -n "$APT" ]; then sudo apt-get install -y -q $APT; fi
          Rscript -e '
            options(repos = c(CRAN = Sys.getenv("CRAN_SNAPSHOT")))
            packages <- strsplit(Sys.getenv("PACKAGES"), " ")[[1]]
            install.packages(packages)
            stopifnot(all(sapply(packages, requireNamespace, quietly = TRUE)))
          '

      # A python/fetch_*.py with the line `# fetch: on build` downloads data that may be
      # fetched freely and do not change; `make data` runs those. It comes before the
      # figure cache, whose key hashes data/.
      - name: Fetch the data
        if: hashFiles(format('{0}/python/fetch_*.py', matrix.dir)) != ''
        run: make data

      # make_figures.py can spend minutes computing a note's numbers before it draws, so
      # reuse the figures until the preprint's Python or Julia, or its data, change.
      - name: Restore the figures
        id: figures
        if: hashFiles(format('{0}/python/make_figures.py', matrix.dir)) != ''
        uses: actions/cache@v6.1.0
        with:
          path: ${{ matrix.dir }}/figures
          key: figures-${{ matrix.job }}-${{ hashFiles(format('{0}/**/*.py', matrix.dir), format('{0}/**/*.py.lock', matrix.dir), format('{0}/julia/**', matrix.dir), format('{0}/R/**', matrix.dir), format('{0}/data/**', matrix.dir)) }}

      # make figures runs make_figures.py, then any script marked `# run: after figures`.
      - name: Draw the figures
        if: steps.figures.outcome == 'success' && steps.figures.outputs.cache-hit != 'true'
        run: make figures

      - name: Compile with the stamp
        env:
          JOB: ${{ matrix.job }}
          STAMP: ${{ github.repository }}
        run: |
          date=$(LC_ALL=C date -u '+%-d %b %Y')
          sha=${SHA::7}
          cat > stamp.tex <<EOF
          \AddToHookNext{shipout/foreground}{%
            \put(0.6in,-0.5\paperheight){\rotatebox{90}{\makebox[0pt][c]{%
              \fontsize{16}{16}\selectfont\sffamily\color{black!45}%
              ${date}\qquad\detokenize{${STAMP}}\qquad\texttt{${sha}}}}}}
          EOF
          # A preprint written for a journal bundles its class and BibTeX style (cla/cls/jss/)
          # and takes its bibliography from refs/*.bib, so TeX and BibTeX search the folders
          # that hold a .cls or .bst, and BibTeX runs after the first pass.
          vendor=$(find . \( -path ./arxiv-src -o -path ./arxiv-build \) -prune -o \
            \( -name '*.cls' -o -name '*.bst' \) -print | xargs -r -n1 dirname | sort -u | tr '\n' ':')
          export TEXINPUTS=".:${vendor}" BSTINPUTS=".:${vendor}"
          latex() { pdflatex -interaction=nonstopmode -halt-on-error -jobname="$JOB" "\\input{stamp}\\input{$JOB}"; }
          latex
          if compgen -G 'refs/*.bib' > /dev/null; then bibtex "$JOB"; fi
          latex
          latex

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-${{ matrix.job }}
          path: ${{ matrix.dir }}/${{ matrix.job }}.pdf
          if-no-files-found: error

      # arXiv compiles the source itself, so it gets the .tex and the figures it includes.
      # The check compiles that tarball alone in an empty directory, as arXiv will.
      - name: Package and check the arXiv source
        run: make arxiv-check

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: arxiv-${{ matrix.job }}
          path: |
            ${{ matrix.dir }}/${{ matrix.job }}.tar.gz
            ${{ matrix.dir }}/${{ matrix.job }}.zip
          if-no-files-found: error

  # One push with every PDF, so the matrix jobs never race for the branch.
  #
  # Two merges in quick succession race: both builds force-push, and the older one can
  # finish last and overwrite the newer PDFs. So publishing runs one merge at a time, and
  # a build that is no longer of main's tip publishes nothing; the newer merge's build
  # publishes instead.
  publish:
    needs: compile
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Check this build is of main's tip
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${tip::7}; its own build will publish, not this one (${SHA::7})"
          fi

      - uses: actions/download-artifact@v8.0.2
        if: steps.tip.outputs.current == 'true'
        with:
          pattern: pdf-*
          merge-multiple: true
          path: pdfs

      - uses: actions/download-artifact@v8.0.2
        if: steps.tip.outputs.current == 'true'
        with:
          pattern: arxiv-*
          merge-multiple: true
          path: arxiv/arxiv

      # Only for the titles, which the index takes from each preprint's \title.
      - uses: actions/checkout@v6.1.0
        if: steps.tip.outputs.current == 'true'
        with:
          ref: ${{ env.SHA }}
          path: src
          sparse-checkout: preprints

      # One link per PDF, labelled with the main title: the \title text up to its first
      # \\, so a subtitle set on a second line is left out.
      - name: Write the index page
        if: steps.tip.outputs.current == 'true'
        working-directory: pdfs
        run: |
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Preprints</title>
          <link rel="stylesheet" href="style.css">
          <body class="bg-white text-neutral-800 dark:bg-neutral-900 dark:text-neutral-200">
          <main class="mx-auto my-16 max-w-[38rem] px-4 font-serif text-[17px] leading-relaxed">
          <h1 class="mb-6 text-3xl font-bold">Preprints</h1>
          <ul class="list-disc space-y-2 pl-6">
          HTML
            for pdf in *.pdf; do
              job=${pdf%.pdf}
              # The whole \title argument, across lines; a subtitle after \\ is dropped and
              # a macro such as \pkg{cvxcla} keeps only its argument.
              title=$(perl -0ne 'if (/\\title\{((?:[^{}]|\{[^{}]*\})*)\}/) { $t=$1; $t =~ s/\\\\.*//s; $t =~ s/\\[a-zA-Z]+\{([^{}]*)\}/$1/g; $t =~ s/\s+/ /g; $t =~ s/^\s+|\s+$//g; print $t }' ../src/preprints/*/"$job".tex | head -n 1)
              title=${title//--/–}
              title=${title//&/&amp;}; title=${title//</&lt;}; title=${title//>/&gt;}
              echo "  <li><a class=\"text-[#1a4f8b] underline hover:no-underline dark:text-sky-300\" href=\"$pdf\">${title:-$job}</a></li>"
            done
            cat <<HTML
          </ul>
          <footer class="mt-12 text-sm text-neutral-500 [&_a]:underline">Built from <a href="https://github.com/$GITHUB_REPOSITORY/commit/$SHA">${SHA::7}</a> of <a href="https://github.com/$GITHUB_REPOSITORY">$GITHUB_REPOSITORY</a> on $(LC_ALL=C date -u '+%-d %b %Y').</footer>
          </main>
          </body>
          </html>
          HTML
          } > index.html
          touch .nojekyll

      # The page is styled with Tailwind, compiled here into a static style.css holding
      # only the classes index.html uses. The standalone CLI needs no Node; its version
      # and checksum are pinned so the page cannot change under a fixed commit.
      - name: Build the stylesheet with Tailwind
        if: steps.tip.outputs.current == 'true'
        working-directory: pdfs
        env:
          TAILWIND_VERSION: v4.1.13
          TAILWIND_SHA256: b9ed9f8f640d3323711f9f68608aa266dff3adbc42e867c38ea2d009b973be11
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/$TAILWIND_VERSION/tailwindcss-linux-x64"
          echo "$TAILWIND_SHA256  $RUNNER_TEMP/tailwindcss" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tailwindcss"
          cat > "$RUNNER_TEMP/input.css" <<CSS
          @import "tailwindcss" source(none);
          @source "$PWD/index.html";
          CSS
          "$RUNNER_TEMP/tailwindcss" -i "$RUNNER_TEMP/input.css" -o style.css --minify

      - name: Publish to the paper branch
        if: steps.tip.outputs.current == 'true'
        working-directory: pdfs
        run: |
          git init -q -b paper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.pdf index.html style.css .nojekyll
          git commit -q -m "preprints from ${SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" paper

      # The arXiv sources go to their own branch, which holds nothing else, as
      # arxiv/<preprint>.tar.gz and arxiv/<preprint>.zip: ready to upload as they are.
      - name: Publish to the arxiv branch
        if: steps.tip.outputs.current == 'true'
        working-directory: arxiv
        run: |
          git init -q -b arxiv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arxiv/*.tar.gz arxiv/*.zip
          git commit -q -m "arXiv sources from ${SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" arxiv
