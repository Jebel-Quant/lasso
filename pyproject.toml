[project]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
name = "lasso"
version = "0.1.0"
description = "Lasso and sparse regression tools for quantitative finance."
readme = "README.md"
authors = [
    { name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/jebel-quant/lasso"
Repository = "https://github.com/jebel-quant/lasso"

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.bumpversion]
current_version = "0.1.0"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'
